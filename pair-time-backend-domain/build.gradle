plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.kyj'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("http://192.168.56.1:9090/repository/kyj-lib-core/")
        allowInsecureProtocol = true // HTTP 사용 시 필수
        credentials {
            username = "admin"
            password = "1234"
        }
    }
}
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
dependencies {
    // Lombok (먼저 선언)
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'com.kyj:kyj-lib-core:0.0.1-SNAPSHOT'
    annotationProcessor 'org.projectlombok:lombok'

    // JPA 및 관련 의존성 (api로 노출)
    api 'com.kyj:kyj-lib-core-jpa:0.0.1-SNAPSHOT'
    api 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

    // QueryDSL
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Validation
    api 'org.springframework.boot:spring-boot-starter-validation'
}

// 실행 가능한 jar가 아닌 라이브러리로 빌드
bootJar {
    enabled = false
}

jar {
    enabled = true
}

tasks.named('test') {
    useJUnitPlatform()
}

// Maven Publishing 설정
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = 'com.kyj'
            artifactId = 'pair-time-backend-domain'
            version = '0.0.1-SNAPSHOT'
        }
    }

    repositories {
        maven {
            def releasesRepoUrl = "http://192.168.56.1:9090/repository/kyj-lib-core/"
            def snapshotsRepoUrl = "http://192.168.56.1:9090/repository/kyj-lib-core/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            allowInsecureProtocol = true
            credentials {
                username = "admin"
                password = "1234"
            }
        }
    }
}
