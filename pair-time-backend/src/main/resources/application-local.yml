# KYJ Core Library 통합 설정
server:
  port: 8082
  tomcat:
    mbeanregistry:
      enabled: true
spring:
  # 애플리케이션 기본 설정
  application:
    name: pair-time-backend-auth

  # ===== 이메일 설정 (kyj-lib-core) =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== 데이터베이스 설정 (kyj-lib-core-rdb, kyj-lib-core-jpa) =====
  datasource:
    url: jdbc:mysql://localhost:3306/pairTime?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
#    hikari:
#      maximum-pool-size: 20
#      minimum-idle: 5
#      connection-timeout: 30000
#      idle-timeout: 600000
#      max-lifetime: 1800000

  # JPA 설정 (kyj-lib-core-jpa)

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          batch_size: 50       # 배치 사이즈 (몇 개씩 묶어서 DB 전송할지)
          order_inserts: true      # INSERT 순서 정렬 (batch 효율 향상)
          order_updates: true      # UPDATE 순서 정렬
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== Redis 설정 (kyj-lib-core-redis) =====
  redis:
    host: 100.114.34.71
    port: 6380

#  # ===== Kafka 설정 (kyj-lib-core-kafka) =====
#  kafka:
#    bootstrap-servers: 100.114.34.71:9095,100.114.34.71:9096,100.114.34.71:9097
#    producer:
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.apache.kafka.common.serialization.StringSerializer
#      acks: all
#      retries: 3
#    consumer:
#      group-id: ${KAFKA_CONSUMER_GROUP:kyj-core-group}
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      auto-offset-reset: latest
#      enable-auto-commit: false
#    listener:
#      ack-mode: manual




# ===== 모니터링 설정 (kyj-lib-core 포함) =====
management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ===== AWS S3 설정 (kyj-lib-core-file) =====
s3:
  credentials:
    access-key: ${S3_ACCESS}
    secret-key: ${S3_SECRET}
    region: ap-northeast-2
    bucket: ${S3_BUCKET}

# ===== KYJ 모듈 설정 =====
kyj:
  security:
    auth:
      enabled: false  # 인증 서버 모듈 활성화 (기본값: true)
      token:
        secret: asdasdsadasdassdasdsadxxadasdasdsadsadads
        access-token-expiry: 86400000      # 24시간(로컬)
        refresh-token-expiry: 86400000    # 24시간
    client:
      enabled: true # 클라이언트 모듈 활성화 (기본값: true)
      use-api-gateway: false  # true: API Gateway, false: JWT
      enable-blacklist: true
      static-public-endpoints:
        - /actuator
        - /health
        - /favicon.ico
        - /error
        - /api/public
        - /docs
        - /oauth2/**
        - /login/**
        - /actuator/**
        - /invite/link/**

# ===== 로깅 설정 =====
logging:
  level:
    com.kyj.backend.auth: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.hibernate.orm.jdbc.bind: TRACE


