# KYJ Core Library 통합 설정
server:
  port: 8080

spring:

  # 애플리케이션 기본 설정
  application:
    name: pair-time-backend

  # ===== 이메일 설정 (kyj-lib-core) =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== 데이터베이스 설정 (kyj-lib-core-rdb, kyj-lib-core-jpa) =====
  datasource:
    url: jdbc:mysql://localhost:3306/pairTime?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
#    hikari:
#      maximum-pool-size: 20
#      minimum-idle: 5
#      connection-timeout: 30000
#      idle-timeout: 600000
#      max-lifetime: 1800000

  # JPA 설정 (kyj-lib-core-jpa)

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== Redis 설정 (kyj-lib-core-redis) =====
  redis:
    host: 100.114.34.71
    port: 6380

  # ===== Kafka 설정 (kyj-lib-core-kafka) =====
  kafka:
    bootstrap-servers: 100.114.34.71:9095,100.114.34.71:9096,100.114.34.71:9097
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
#      group-id: ${KAFKA_CONSUMER_GROUP:kyj-core-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual

  # ===== OAuth2 설정 (kyj-lib-core-security-auth) =====


# ===== 모니터링 설정 (kyj-lib-core 포함) =====
