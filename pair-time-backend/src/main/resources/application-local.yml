# ===== AWS S3 설정 (kyj-lib-core-file) =====
s3:
  credentials:
    access-key: ${S3_ACCESS}
    secret-key: ${S3_SECRET}
    region: ap-northeast-2
    bucket: ${S3_BUCKET}

# ===== KYJ 모듈 설정 =====
kyj:

  security:
    auth:
      enabled: false  # 인증 서버 모듈 활성화 (기본값: true)
      token:
        secret: asdasdsadasdassdasdsadxxadasdasdsadsadads
        access-token-expiry: 3600000      # 1시간
        refresh-token-expiry: 86400000    # 24시간
    client:
      enabled: true # 클라이언트 모듈 활성화 (기본값: true)
      use-api-gateway: false  # true: API Gateway, false: JWT
      enable-blacklist: true
      api-gateway:
        user-id-header: "X-User-Id"
        username-header: "X-Username"
        email-header: "X-Email"
        roles-header: "X-Roles"
        token-header: "X-Token"
      static-public-endpoints:
        - /actuator
        - /health
        - /favicon.ico
        - /error
        - /api/public
        - /docs
        - /oauth2/**
        - /login/**


# ===== 로깅 설정 =====
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace


